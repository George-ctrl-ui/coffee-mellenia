version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: coffee_mellenia_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: coffee_mellenia
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coffee_mellenia_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/coffee_mellenia?schema=public
      PORT: 3001
      ADMIN_TOKEN: mellenia_admin_key_2026
      FRONTEND_URL: http://localhost:3000
    ports:
      - '3001:3001'
    depends_on:
      - postgres

volumes:
  postgres_data:
